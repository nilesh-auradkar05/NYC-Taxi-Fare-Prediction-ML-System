name: CI

on:
  push:
    branches: [main, nyc-taxi-prediction-v2]
  pull_request:
    branches: [main, nyc-taxi-prediction-v2]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-serving.txt', 'requirements-training.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx
          pip install -r requirements-serving.txt
          pip install -r requirements-training.txt

      - name: Syntax check
        run: |
          python -c "
          import ast, sys, pathlib
          errors = []
          for f in pathlib.Path('src').rglob('*.py'):
              try:
                  ast.parse(f.read_text())
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          for f in pathlib.Path('tests').rglob('*.py'):
              try:
                  ast.parse(f.read_text())
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All files OK')
          "

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: dbt compile (DuckDB fixture)
        run: make dbt-compile
