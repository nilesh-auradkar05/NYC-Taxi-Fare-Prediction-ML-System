nyc_taxi:
  target: "{{ env_var('DBT_TARGET', 'ci') }}"
  outputs:
    ci:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'fixtures/nyc_taxi_ci.duckdb') }}"
      schema: "{{ env_var('DBT_DUCKDB_SCHEMA', 'analytics') }}"
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"

    athena:
      type: athena
      s3_staging_dir: "{{ env_var('DBT_ATHENA_S3_STAGING_DIR') }}"
      s3_data_dir: "{{ env_var('DBT_ATHENA_S3_DATA_DIR') }}"
      s3_data_naming: "{{ env_var('DBT_ATHENA_S3_DATA_NAMING', 'schema_table_unique') }}"
      region_name: "{{ env_var('DBT_ATHENA_REGION') }}"
      database: "{{ env_var('DBT_ATHENA_DATABASE') }}"
      schema: "{{ env_var('DBT_ATHENA_SCHEMA') }}"
      work_group: "{{ env_var('DBT_ATHENA_WORK_GROUP') }}"
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      num_retries: "{{ env_var('DBT_ATHENA_NUM_RETRIES', '3') | int }}"
