[project]
name = "nyc-taxi"
version = "0.2.0"
description = "An End-to-End production grade ML System using MLflow. The initial downstream task of the system is to predict the total fare of the trip. Nyc yellow taxi dataset is being used for training of ml models."
authors = [
    {name = "Nilesh Auradkar",email = "nilesh.auradkar.0599@gmail.com"}
]

readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.40",
    "botocore>=1.43.40",
    "evidently>=0.7.21",
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "kfp>=2.16.0",
    "loguru>=0.7.3",
    "mlflow>=3.10.1",
    "mypy>=1.20.0",
    "numpy>=2.4.4",
    "onnxmltools>=1.16.0",
    "onnxruntime>=1.24.4",
    "pandas-stubs>=3.0.0.260204",
    "pandas<3.0.0",
    "prometheus-client>=0.24.1",
    "pydantic>=2.12.5",
    "pyspark>=4.1.2",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "ruff>=0.15.9",
    "scikit-learn>=1.8.0",
    "streamlit>=1.56.0",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.33.0.20260402",
    "xgboost>=3.2.0",
]



[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "ingestion/lambdas"]
addopts = "-q"
markers = [
  "integration: tests that hit real AWS/dev resources",
  "spark: tests requiring local Spark",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = "(?x)(^nyc-taxi-env/|^\\.venv/)"
